name: Update flake inputs

on:
  schedule:
    # Run weekly on Sundays at 6:00 AM UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

# Determinate Nix enables lazy trees by default, which breaks
# `builtins.toString inputs.nix-secrets` in hosts/common/core/sops.nix.
# Keep CI on the same evaluation semantics as local nix 2.28.
env:
  NIX_EXTRA_CONF: |
    accept-flake-config = true
    lazy-trees = false

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Setup SSH for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_SSH_KEY }}

      - name: Check for flake updates
        id: check
        run: |
          cp flake.lock flake.lock.old
          nix flake update

          if diff -q flake.lock flake.lock.old > /dev/null; then
            echo "No updates available"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Updates available"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi
          rm flake.lock.old

      # Every downstream job must build and commit the exact same lock file.
      # Re-running `nix flake update` per job resolves branch refs at a
      # different moment and can commit a lock that was never validated.
      - name: Upload updated flake.lock
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1

  build-nixos:
    needs: check-update
    if: needs.check-update.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: [altair]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Setup SSH for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_SSH_KEY }}

      - uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Build NixOS configuration (${{ matrix.host }})
        run: |
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run

  build-darwin:
    needs: check-update
    if: needs.check-update.outputs.has_updates == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: [deneb]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Setup SSH for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_SSH_KEY }}

      - uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Build Darwin configuration (${{ matrix.host }})
        run: |
          nix build .#darwinConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run

  update-flake-lock:
    needs: [build-nixos, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Commit flake.lock
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake inputs"
          git push
